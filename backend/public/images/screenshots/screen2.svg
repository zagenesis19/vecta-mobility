<svg width="300" height="600" viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="300" height="600" fill="#F4F6F8"/>
    <circle cx="250" cy="50" r="100" fill="#80C5DE" opacity="0.2"/>
    <circle cx="0" cy="500" r="150" fill="#001F5B" opacity="0.1"/>
    
    <!-- Headline -->
    <text x="30" y="80" font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="#001F5B">Llega más</text>
    <text x="30" y="120" font-family="Arial, sans-serif" font-weight="black" font-size="40" fill="#001F5B">RÁPIDO</text>
    
    <!-- Abstract Phone Frame -->
    <g transform="translate(30, 180)">
        <rect x="0" y="0" width="240" height="450" rx="20" fill="white" stroke="#E5E7EB" stroke-width="4" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))"/>
        <!-- Screen Content: Map -->
        <rect x="10" y="10" width="220" height="430" rx="15" fill="#e0f2fe"/>
        
        <!-- Map Roads -->
        <path d="M10 100 L230 150" stroke="white" stroke-width="15"/>
        <path d="M150 10 L100 430" stroke="white" stroke-width="15"/>
        
        <!-- Route -->
        <path d="M50 350 Q120 250 180 150" stroke="#001F5B" stroke-width="6" fill="none" stroke-dasharray="10,5"/>
        
        <!-- Location Markers -->
        <circle cx="50" cy="350" r="10" fill="#001F5B"/>
        <circle cx="180" cy="150" r="10" fill="#EF4444"/>
        
        <!-- UI Card -->
        <rect x="25" y="300" width="190" height="100" rx="10" fill="white" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
        <text x="40" y="330" font-family="Arial" font-size="12" fill="#6B7280">Destino</text>
        <text x="40" y="350" font-family="Arial" font-weight="bold" font-size="14" fill="#111827">Charallave Centro</text>
        <rect x="160" y="330" width="40" height="40" rx="20" fill="#80C5DE" opacity="0.3"/>
        <text x="172" y="355" font-family="Arial" font-size="16">➔</text>
    </g>
</svg>
